<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Withdraw Funds</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Request a PayPal Withdrawal</h2>
    <form id="withdrawal-form">
        <label for="email">PayPal Email Address:</label><br>
        <input type="email" id="email" required><br><br>

        <label for="amount">Amount (USD):</label><br>
        <input type="number" id="amount" step="0.01" min="1.00" required><br><br>

        <button type="submit">Submit Withdrawal Request</button>
    </form>

    <div id="status-message"></div>

    <script>
        document.getElementById('withdrawal-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const amount = document.getElementById('amount').value;
            const statusDiv = document.getElementById('status-message');

            statusDiv.innerText = "Processing withdrawal...";

            try {
                // Change this in your index.html file:
               // Use a relative path. Since the frontend and backend live together, 
// it will automatically call the correct Render URL.
const response = await fetch('/api/withdraw', { 
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, amount })
});


                const data = await response.json();

                if (response.ok) {
                    statusDiv.innerHTML = `<span style="color:green;">Success! Payout Batch ID: ${data.batch_header.payout_batch_id}</span>`;
                } else {
                    statusDiv.innerHTML = `<span style="color:red;">Error: ${data.message || 'Payout failed'}</span>`;
                }
            } catch (err) {
                statusDiv.innerHTML = `<span style="color:red;">Server error. Please try again.</span>`;
            }
        });
    </script>
</body>
</html>
